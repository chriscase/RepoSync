name: Acceptance lab

on:
  pull_request:
    paths:
      - tests/acceptance-lab/**
      - scripts/acceptance-lab.sh
      - docs/acceptance-lab/**
      - .github/workflows/acceptance-lab.yml
  workflow_dispatch:
    inputs:
      suite:
        description: smoke, full, or soak
        type: choice
        options:
          - smoke
          - full
          - soak
        default: smoke
      seed:
        description: Integer seed
        type: string
        default: "1"

# Least privilege: contents: read checks out the repository. Artifact upload
# obtains an Actions runtime token of its own. This workflow makes no
# repository Actions API call, so it does not grant actions: write.
permissions:
  contents: read

concurrency:
  group: acceptance-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-regressions:
    name: Harness failure regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix tests/acceptance-lab ci --ignore-scripts
      - run: npm --prefix tests/acceptance-lab run typecheck
      - run: node tests/acceptance-lab/src/self-test.mjs
      - run: node tests/acceptance-lab/src/ci-gate.mjs self-check --scratch "${RUNNER_TEMP}/lab-artifacts/ci-gate-check"
      - run: node tests/acceptance-lab/src/engine-lock-check.mjs
      - name: Install SQLite for observer regressions
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: Verify isolation infrastructure failures are rejected
        run: npm --prefix tests/acceptance-lab exec -- playwright test -c tests/acceptance-lab/playwright.regression.config.ts --grep-invert 'annotated pass then fails'
      - name: Verify unqualified cases and failures do not omit later cases
        run: node tests/acceptance-lab/src/continuation-check.mjs
      - name: Verify launcher and evidence failures are rejected
        run: bash tests/acceptance-lab/src/fail-closed-check.sh

  build-daemon:
    name: Build daemon image
    needs: harness-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner resources
        run: |
          echo "documented public runner: 4 vCPU, 16 GB RAM, 14 GB SSD"
          nproc
          head -n 8 /proc/meminfo
          df -h

      - name: Resolve candidate
        id: id
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "candidate=${sha}"
          echo "github_sha=${{ github.sha }}"
          echo "pr_head=${{ github.event.pull_request.head.sha }}"
          echo "audited=068562a90bfafd9b2a142cea524a89574814cba5"
          echo "authored_snapshot_main=af394285869bdffa5f156c651cd1104027832749"
          echo "authored_snapshot_pr194=6c84adf858a8a2e5d7ac3a9f618bee1834f4d297"
          echo "live refs are fetched into identity.json; a miss stays NOT_ESTABLISHED"

      - name: Build daemon image
        env:
          ACCEPTANCE_LAB_PREPARE_SCOPE: daemon
          ACCEPTANCE_LAB_ARTIFACT_ROOT: ${{ runner.temp }}/acceptance-lab
        run: scripts/acceptance-lab.sh prepare --candidate "${{ steps.id.outputs.sha }}"

      - name: Save daemon image
        run: docker save "rsacc-reposync:${{ steps.id.outputs.sha }}" | gzip -1 > "${{ runner.temp }}/reposync-image.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-lab-daemon-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reposync-image.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Show recorded toolchain identity
        if: always()
        run: |
          dest="${RUNNER_TEMP}/acceptance-lab/build-graph"
          if [ -f "$dest/image-identity.txt" ]; then
            cat "$dest/image-identity.txt"
          else
            echo "image-identity.txt was not written"
          fi
          if [ -f "$dest/rustc-version.txt" ]; then
            echo "--- rustc-version.txt ---"
            cat "$dest/rustc-version.txt"
          fi
          if [ -f "$dest/Cargo.lock.sha256" ]; then
            echo "--- Cargo.lock.sha256 ---"
            cat "$dest/Cargo.lock.sha256"
          fi
          if [ -f "$dest/reposync-image.txt" ]; then
            echo "--- reposync-image.txt ---"
            cat "$dest/reposync-image.txt"
          fi

      - name: Upload toolchain identity and dependency graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-lab-build-graph-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance-lab/build-graph
          retention-days: 14
          if-no-files-found: error

  engine:
    name: Real-engine suite
    needs: build-daemon
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'full' || github.event.inputs.suite == 'soak')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install svn and git
        run: sudo apt-get update && sudo apt-get install -y subversion git

      # The unowned suite selects `rustup run stable` when a toolchain named
      # stable exists, and otherwise uses cargo on PATH. This job installs the
      # harness pin and removes that stable name. It does not edit the suite
      # and it does not commit a root Cargo.lock. The disposable checkout uses
      # the verified lock exported by this candidate's daemon build.
      - name: Prepare the harness compiler
        run: |
          . tests/acceptance-lab/pins.env
          echo "lab_rust_image=${RUST_IMAGE}"
          echo "lab_rust_toolchain=${RUST_TOOLCHAIN}"
          echo "aligned_with=Dockerfile.reliability rust:1.98.1-bookworm"
          echo "product Dockerfile remains rust:1.83-bookworm and is not built by this job"
          echo "before"
          if command -v rustc >/dev/null 2>&1; then rustc --version; else echo "rustc absent"; fi
          if command -v cargo >/dev/null 2>&1; then cargo --version; else echo "cargo absent"; fi
          if command -v rustup >/dev/null 2>&1; then rustup toolchain list; else echo "rustup absent"; fi
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain "${RUST_TOOLCHAIN}" --profile minimal --no-modify-path
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.cargo/bin:${PATH}"
          if rustup toolchain list | grep -q '^stable'; then
            rustup toolchain uninstall stable
          fi
          rustup default "${RUST_TOOLCHAIN}"
          echo "after"
          rustc --version
          cargo --version
          rustup toolchain list

      - uses: actions/download-artifact@v4
        with:
          name: acceptance-lab-build-graph-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-build-graph

      - name: Install the candidate build lockfile
        id: lock
        run: |
          node tests/acceptance-lab/src/engine-lock.mjs \
            --graph "${RUNNER_TEMP}/engine-build-graph" \
            --candidate "$(git rev-parse HEAD)" \
            --destination Cargo.lock \
            --receipt "${RUNNER_TEMP}/engine-lock-identity.json"

      - name: Run real-engine suite
        id: engine
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: Test User
          GIT_AUTHOR_EMAIL: test@example.com
          GIT_COMMITTER_NAME: Test User
          GIT_COMMITTER_EMAIL: test@example.com
          REPOSYNC_TEST_SVN_PW: fixture-only-svn-secret
          REPOSYNC_TEST_GH_TOKEN: fixture-only-git-secret
        run: |
          unset GITHUB_TOKEN || true
          unset GH_TOKEN || true
          unset SSH_AUTH_SOCK || true
          export PATH="${HOME}/.cargo/bin:${PATH}"
          rustc --version
          cargo --version
          scripts/real-engine-scenario-suite.sh

      - name: Verify the engine retained the selected lockfile
        if: always() && steps.lock.outcome == 'success'
        run: cmp "${RUNNER_TEMP}/engine-build-graph/Cargo.lock" Cargo.lock

      - name: Stage engine summary or the missing-artifact record
        if: always()
        run: node tests/acceptance-lab/src/ci-gate.mjs stage-engine --root artifacts/real-engine-scenarios --dest "${RUNNER_TEMP}/engine-upload"

      - name: Stage and scrub engine diagnostics
        id: engine_publish
        if: always()
        run: |
          dest="${RUNNER_TEMP}/engine-upload"
          mkdir -p "$dest/logs"
          if [ -f "${RUNNER_TEMP}/engine-lock-identity.json" ]; then
            cp "${RUNNER_TEMP}/engine-lock-identity.json" "$dest/lock-identity.json"
          fi
          for directory in artifacts/real-engine-scenarios/*; do
            [ -d "$directory" ] || continue
            mkdir -p "$dest/logs/$(basename "$directory")"
            for file in "$directory"/*.log "$directory"/results.ndjson; do
              [ -f "$file" ] || continue
              cp "$file" "$dest/logs/$(basename "$directory")/"
            done
          done
          printf '%s\n' fixture-only-svn-secret fixture-only-git-secret > "${RUNNER_TEMP}/engine-secrets.txt"
          node tests/acceptance-lab/src/scrub.mjs --root "$dest" --secrets-file "${RUNNER_TEMP}/engine-secrets.txt"
          node tests/acceptance-lab/src/scan.mjs --root "$dest" --secrets-file "${RUNNER_TEMP}/engine-secrets.txt" --out "$dest/scan.json"

      - name: Upload engine summary
        if: always() && steps.engine_publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-lab-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-upload
          retention-days: 14
          if-no-files-found: error

      - name: Fail when the engine summary is missing
        if: always()
        run: node tests/acceptance-lab/src/ci-gate.mjs require-engine --dest "${RUNNER_TEMP}/engine-upload"

      - name: Preserve engine exit
        if: always() && steps.engine.outcome == 'failure'
        run: exit 1

  browser:
    name: Browser and stack
    needs: build-daemon
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LAB_EVENT_NAME: ${{ github.event_name }}
      LAB_SUITE_INPUT: ${{ github.event.inputs.suite }}
      LAB_SEED_INPUT: ${{ github.event.inputs.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner resources
        run: |
          echo "documented public runner: 4 vCPU, 16 GB RAM, 14 GB SSD"
          nproc
          head -n 8 /proc/meminfo
          df -h

      - uses: actions/download-artifact@v4
        with:
          name: acceptance-lab-daemon-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daemon-image

      - name: Load daemon image
        run: docker load --input "${{ runner.temp }}/daemon-image/reposync-image.tar.gz"

      - name: Install lab package
        run: npm --prefix tests/acceptance-lab ci --ignore-scripts --cache "${{ runner.temp }}/npm-cache"

      - name: Install Chromium
        run: npm --prefix tests/acceptance-lab exec -- playwright install --with-deps chromium

      - name: Run acceptance lab
        id: lab
        continue-on-error: true
        env:
          ACCEPTANCE_LAB_SKIP_REPOSYNC_BUILD: "1"
          ACCEPTANCE_LAB_SKIP_ENGINE: "1"
          ACCEPTANCE_LAB_ARTIFACT_ROOT: ${{ runner.temp }}/acceptance-lab
          LAB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAB_GITHUB_SHA: ${{ github.sha }}
          LAB_GITHUB_EVENT: ${{ github.event_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          resolved="${RUNNER_TEMP}/acceptance-lab-selection.env"
          node tests/acceptance-lab/src/ci-gate.mjs resolve --out "$resolved"
          # resolve writes only an allowlisted suite and an integer seed.
          . "$resolved"
          scripts/acceptance-lab.sh test --suite "$SUITE" --candidate "$sha" --seed "$SEED"

      - name: Record missing runtime artifacts
        if: always()
        run: node tests/acceptance-lab/src/ci-gate.mjs note-publish --root "${RUNNER_TEMP}/acceptance-lab"

      - name: Upload scrubbed publish directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-lab-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance-lab/*/publish
          retention-days: 14
          if-no-files-found: error

      - name: Fail when required runtime artifacts are missing
        if: always()
        run: node tests/acceptance-lab/src/ci-gate.mjs require-publish --root "${RUNNER_TEMP}/acceptance-lab"

      - name: Prove interruption cleanup
        if: always()
        env:
          ACCEPTANCE_LAB_SKIP_REPOSYNC_BUILD: "1"
        run: |
          sha="$(git rev-parse HEAD)"
          scripts/acceptance-lab.sh interrupt-probe --suite smoke --candidate "$sha" --seed 1

      - name: Clean this run
        if: always()
        env:
          ACCEPTANCE_LAB_ARTIFACT_ROOT: ${{ runner.temp }}/acceptance-lab
        run: |
          id_file="${RUNNER_TEMP}/acceptance-lab-run-id"
          if [ -f "$id_file" ]; then
            scripts/acceptance-lab.sh clean --run-id "$(cat "$id_file")"
          fi

      - name: Preserve lab exit
        if: always() && steps.lab.outcome == 'failure'
        run: exit 1

  report:
    name: Candidate report
    if: always()
    needs:
      - build-daemon
      - browser
      - engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAB_EVENT_NAME: ${{ github.event_name }}
      LAB_SUITE_INPUT: ${{ github.event.inputs.suite }}
      LAB_SEED_INPUT: ${{ github.event.inputs.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: acceptance-lab-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'full' || github.event.inputs.suite == 'soak')
        continue-on-error: true
        with:
          name: acceptance-lab-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: engine

      - name: Aggregate one report
        id: report
        run: |
          sha="$(git rev-parse HEAD)"
          node tests/acceptance-lab/src/ci-gate.mjs aggregate --evidence evidence --engine engine --report-dir "${RUNNER_TEMP}/acceptance-lab-report" --candidate "$sha"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-lab-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance-lab-report
          retention-days: 14
          if-no-files-found: error

      - name: Fail on infrastructure gaps or a suite that did not pass
        if: always()
        run: node tests/acceptance-lab/src/ci-gate.mjs enforce --evidence evidence --engine engine --report-dir "${RUNNER_TEMP}/acceptance-lab-report"
