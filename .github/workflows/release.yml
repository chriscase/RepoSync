name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  channel:
    name: Classify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.classify.outputs.channel }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      make_latest: ${{ steps.classify.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v4

      # An unrecognized tag stops here, before anything is built or published.
      - name: Classify tag
        id: classify
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_release_channel.sh
          # Capture first: a pipe would hide the classifier's refusal.
          outputs="$(bash scripts/release_channel.sh "$TAG")"
          printf '%s\n' "$outputs" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$outputs"

  build:
    name: Build ${{ matrix.target }}
    needs: channel
    if: needs.channel.outputs.channel == 'stable' || needs.channel.outputs.channel == 'prerelease'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and verify native binaries
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          cargo build --release --target "${{ matrix.target }}" --bin reposync --bin reposync-daemon
          "./target/${{ matrix.target }}/release/reposync" --version
          "./target/${{ matrix.target }}/release/reposync-daemon" --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Package
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ARCHIVE="reposync-${TAG}-${{ matrix.target }}.tar.gz"
          bash scripts/assemble_release_archive.sh \
            --bin-dir "target/${{ matrix.target }}/release" \
            --out "${ARCHIVE}"
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    name: Create Release
    needs: [channel, build]
    if: needs.channel.outputs.channel == 'stable' || needs.channel.outputs.channel == 'prerelease'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify checksums
        run: |
          for f in reposync-*.tar.gz.sha256; do
            echo "Verifying $(basename "$f" .sha256)..."
            sha256sum -c "$f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A prerelease never becomes the latest release.
          prerelease: ${{ needs.channel.outputs.prerelease }}
          make_latest: ${{ needs.channel.outputs.make_latest }}
          files: |
            reposync-*.tar.gz
            reposync-*.tar.gz.sha256
            scripts/install.sh

  docker:
    name: Docker Image
    needs: [channel, build, release]
    if: needs.channel.outputs.channel == 'stable' || needs.channel.outputs.channel == 'prerelease'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only a stable tag moves `latest`; a prerelease publishes its exact version.
      - name: Select image tags
        id: tags
        env:
          CHANNEL: ${{ needs.channel.outputs.channel }}
          TAG: ${{ github.ref_name }}
        run: |
          tags="ghcr.io/chriscase/reposync:${TAG}"
          if [ "$CHANNEL" = "stable" ]; then
            tags="${tags},ghcr.io/chriscase/reposync:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Verify Docker image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker pull "ghcr.io/chriscase/reposync:${TAG}"
          docker run --rm "ghcr.io/chriscase/reposync:${TAG}" --version
