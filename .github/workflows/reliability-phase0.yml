name: Reliability Phase 0 diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run fixture-only real-engine and API diagnostics
        run: scripts/reliability-container.sh --diagnostics
      - name: Preserve fixture-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-phase0-${{ github.sha }}
          path: artifacts/reliability-phase0/
          retention-days: 14
          if-no-files-found: warn
