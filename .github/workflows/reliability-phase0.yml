name: Reliability Phase 0 diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-diagnostics:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install local SVN tools
        run: |
          if ! command -v svnadmin >/dev/null || ! command -v svnlook >/dev/null; then
            brew install subversion
          fi
      - name: Pin compatible local dependency resolution
        run: cargo update -p toml --precise 0.8.23
      - name: Run disposable real-engine and API diagnostics
        run: scripts/reliability-phase0.sh --diagnostics
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-phase0-${{ github.sha }}
          path: artifacts/reliability-phase0/
          retention-days: 14
          if-no-files-found: warn
